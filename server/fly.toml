# Fly.io settings for the server. Run from the REPOSITORY ROOT:
#   fly launch --no-deploy --copy-config --config server/fly.toml --dockerfile server/Dockerfile
#   fly secrets set --config server/fly.toml HUB_SUPABASE_URL=... HUB_SUPABASE_PUBLISHABLE_KEY=... HUB_SUPABASE_SERVICE_KEY=... CRON_SECRET=... SPOKE_..._URL=... SPOKE_..._SERVICE_KEY=...
#   fly deploy --config server/fly.toml --dockerfile server/Dockerfile
# Secrets are set with `fly secrets`, never written here. See docs/deployment/SERVER.md.
app = "dwdg-server"
primary_region = "sin"

[env]
  PORT = "8787"
  # Fly puts the visitor's address in this header and overwrites any the visitor sent.
  CLIENT_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 8787
  force_https = true
  # One process holds the rate limiter's counts in memory and the free tier would otherwise stop it when idle: keep exactly one running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
