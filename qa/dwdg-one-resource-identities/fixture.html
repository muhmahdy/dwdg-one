<!doctype html>
<html lang="en" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource identity verification</title>
<link rel="stylesheet" href="/dwdg-one-preview.css"><link rel="stylesheet" href="/dwdg-one-resource-material.css">
<style>body{padding:24px;margin:0;color:var(--one-text);background:var(--one-canvas);font:16px/1.5 sans-serif}button{min-height:44px;padding:8px 12px;margin:3px;border:1px solid var(--one-line);border-radius:8px;color:inherit;background:var(--one-surface)}.controls{max-width:1100px}.stage{display:flex;gap:24px;flex-wrap:wrap;padding:24px;background:var(--one-surface);border:1px solid var(--one-line);margin-top:16px}.sample{display:flex;gap:12px;align-items:center;min-height:80px;min-width:210px}.sample .large{margin:0!important}pre{white-space:pre-wrap;overflow-wrap:anywhere}.below{margin-top:1100px}</style>
<body class="one-preview"><h1>Folder and file identity verification</h1><p>Disposable visual fixture. It reads and writes no saved product records or preferences.</p>
<div class="controls"><button id="normal">Effects on</button><button id="off">Effects off</button><button id="reduced">Reduced motion</button><button id="solid">Solid surfaces</button><button id="theme">Light / dark</button><button id="rerender">Replace identities ten times</button><button id="loss">Lose GPU context</button><button id="unavailable">GPU unavailable</button><button id="compile">Shader failure</button><button id="restore">Restore fixture</button><button id="unmount">Unmount</button><button id="probe">Read metrics</button></div>
<pre id="metrics" aria-live="polite"></pre><main id="identities"></main><script type="module" src="./fixture.mjs"></script></body></html>
