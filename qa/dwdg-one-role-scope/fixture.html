<!doctype html>
<html lang="en" data-theme="light" data-motion="system" data-transparency="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F6F8" />
    <meta name="description" content="An interactive UI preview for DWDG’ONE, the DWDG UII workspace." />
    <title>DWDG’ONE — Local role review</title>
    <link rel="preload" href="/assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/dwdg-one-preview.css" />
    <link rel="stylesheet" href="/dwdg-one-daily.css" />
    <link rel="stylesheet" href="/dwdg-one-home.css" />
    <link rel="stylesheet" href="/dwdg-one-notes.css" />
    <link rel="stylesheet" href="/dwdg-one-resource-material.css" />
    <link rel="stylesheet" href="/dwdg-one-resource-density.css" />
    <link rel="stylesheet" href="/dwdg-one-accessibility.css" />
    <style>
      #role-qa-controls{position:fixed;right:8px;bottom:8px;z-index:1200;max-width:min(380px,calc(100vw - 16px));border:1px solid #bcc3bd;border-radius:12px;background:#f8f9f7;color:#26312a;font:13px/1.5 Pretendard,Arial,sans-serif;box-shadow:0 4px 16px #0002}
      #role-qa-controls summary{min-height:44px;padding:11px 14px;cursor:pointer;box-sizing:border-box}
      #role-qa-controls[open]{max-height:75vh;overflow:auto}
      #role-qa-controls .qa-body{padding:0 12px 12px;display:grid;gap:8px}
      #role-qa-controls p{margin:0}
      #role-qa-controls button{min-width:44px;min-height:44px;white-space:normal;border:1px solid #b9c3bc;border-radius:8px;background:#fff;color:inherit;padding:10px 12px;font:inherit;text-align:left;cursor:pointer}
      #role-qa-controls button:disabled{opacity:.55;cursor:default}
      #role-qa-controls button:focus-visible,#role-qa-controls summary:focus-visible{outline:3px solid #306549;outline-offset:2px}
      #role-qa-evidence{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 ui-monospace,monospace;margin:0;padding:8px;border-radius:6px;background:#edf0eb}
      html[data-theme="dark"] #role-qa-controls{background:#202722;color:#e7ede7;border-color:#59665c}
      html[data-theme="dark"] #role-qa-controls button{background:#303a32;border-color:#748176}
      html[data-theme="dark"] #role-qa-evidence{background:#111a14}
    </style>
  </head>
  <body class="one-preview" data-nav-open="false" data-panel-open="false"><template id="role-qa-shell">
    <a class="one-skip" href="#one-content">Skip to projects</a>
    <div class="one-app">
      <aside class="one-sidebar" aria-label="Workspace navigation">
        <a class="one-brand" href="/dwdg-one-preview.html" aria-label="DWDG’ONE UI preview home">
          <span class="one-brand-symbol" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="one-brand-name">DWDG<span>’ONE</span><small>UII</small></span>
        </a>
        <div id="one-workspace" class="one-workspace"></div>
        <nav id="one-nav" class="one-nav" aria-label="Main navigation"></nav>
        <div class="one-sidebar-footer">
          <div class="one-profile">
            <span class="one-avatar one-avatar--profile" aria-hidden="true">M</span>
            <span id="one-profile-copy"><strong>Mahdy</strong><small id="one-profile-role">Demo admin</small></span>
            <span class="one-profile-dot" aria-hidden="true"></span>
          </div>
          <span id="one-preview-label" class="one-preview-label">UI preview · local demo</span>
        </div>
      </aside>
      <div class="one-body">
        <header class="one-topbar">
          <button type="button" class="one-icon-button one-mobile-menu" data-action="toggle-nav" aria-label="Open navigation" aria-controls="one-nav" aria-expanded="false">
            <svg class="ux-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <div id="one-context" class="one-context"></div>
          <div id="one-top-controls" class="one-top-controls"></div>
        </header>
        <main id="one-page" class="one-page">
          <div id="one-content" class="one-content" tabindex="-1"></div>
          <aside id="one-inspector" class="one-inspector" aria-label="Project detail" hidden></aside>
        </main>
      </div>
    </div>
    <button id="one-nav-backdrop" class="one-nav-backdrop" type="button" data-action="close-nav" aria-label="Close navigation" tabindex="-1"></button>
    <div id="one-feedback" class="one-feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    </template><details id="role-qa-controls" data-fixture-controls>
      <summary>Local role review controls</summary>
      <div class="qa-body">
        <p id="role-qa-actor"></p>
        <p>Disposable illustrative records. VP assignments in this fixture are illustrative.</p>
        <button id="qa-revoke-workspace" type="button">Revoke current workspace</button>
        <button id="qa-hide-selected" type="button">Hide selected record</button>
        <button id="qa-restore-scope" type="button">Restore initial scope</button>
        <p id="role-qa-result" role="status" aria-live="polite"></p>
        <details><summary>Read-only review evidence</summary><pre id="role-qa-evidence" aria-label="Read-only local role review evidence"></pre></details>
      </div>
    </details><script type="module" src="./fixture.mjs"></script>
  </body>
</html>
